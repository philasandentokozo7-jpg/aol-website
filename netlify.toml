# Netlify build/publish config.
#
# Netlify Forms (`aol-website-enquiries`) only work when this site is published on Netlify.
# Recommended: use Netlify as the public host (or at least the form-capable publish target).
# Keep SITE_MODE=staging and INDEXING_ENABLED=false until official launch QA.
# Official domain: https://aolaccountants.co.za (not aolaccounting.co.za).
# See docs/POST_DEPLOY_STATUS.md and docs/DOMAIN_AND_EMAIL_LAUNCH_INSTRUCTIONS.md.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NEXT_PUBLIC_SITE_MODE = "staging"
  NEXT_PUBLIC_INDEXING_ENABLED = "false"
  NEXT_PUBLIC_OFFICIAL_SITE_URL = "https://aolaccountants.co.za"
  NEXT_PUBLIC_PREVIEW_SITE_URL = "https://aol-accounting-academy.netlify.app"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
