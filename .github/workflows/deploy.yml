name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (Next.js static export → out/)
        env:
          # Default to staging/noindex until official-domain launch secrets are set.
          NEXT_PUBLIC_SITE_MODE: ${{ vars.NEXT_PUBLIC_SITE_MODE || 'staging' }}
          NEXT_PUBLIC_INDEXING_ENABLED: ${{ vars.NEXT_PUBLIC_INDEXING_ENABLED || 'false' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || '' }}
          NEXT_PUBLIC_OFFICIAL_SITE_URL: ${{ vars.NEXT_PUBLIC_OFFICIAL_SITE_URL || 'https://aolaccountants.co.za' }}
          NEXT_PUBLIC_PREVIEW_SITE_URL: ${{ vars.NEXT_PUBLIC_PREVIEW_SITE_URL || 'https://aol-accounting-academy.netlify.app' }}
        run: npm run build

      - name: Ensure GitHub Pages files exist in output
        run: |
          touch out/.nojekyll
          # Never publish a repo CNAME from CI. Custom domains are configured only in the
          # host dashboard after DNS for aolaccountants.co.za points at the chosen host.
          # Do not use the parking/typo domain aolaccounting.co.za.
          rm -f out/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
